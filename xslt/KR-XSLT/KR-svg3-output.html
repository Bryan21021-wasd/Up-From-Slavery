      <h1>Project Themes Mentioned in Each Chapter</h1><svg viewBox="0 0 1000 650">
         <g transform="translate(250,10)">
            <line x1="0" x2="60" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="60" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : I had no schooling whatever while I was a slave, though I remember on
               several occasions I went as far as the schoolhouse door with one of my
               young mistresses to carry her books. The picture of several dozen boys
               and girls in a schoolroom engaged in study made a deep impression upon
               me, and I had the feeling that to get into a schoolhouse and study in
               this way would be about the same as getting into paradise.</text>
            <text x="70" y="30" text-anchor="right">4</text>
            <line x1="0" x2="135" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="135" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : My life had its beginning in the midst of the most miserable, desolate,
               and discouraging surroundings.</text>
            <text x="145" y="60" text-anchor="right">9</text>
            <line x1="0" x2="120" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="120" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : At that time
               there was not a single member of my race anywhere near us who could
               read, and I was too timid to approach any of the white people.</text>
            <text x="130" y="30" text-anchor="right">8</text>
            <line x1="0" x2="165" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="165" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : The first thing I ever learned in the way of book knowledge was while
               working in this salt-furnace. Each salt-packer had his barrels marked
               with a certain number. The number allotted to my stepfather was “18.”
               At the close of the day’s work the boss of the packers would come
               around and put “18” on each of our barrels, and I soon learned to
               recognize that figure wherever I saw it, and after a while got to the
               point where I could make that figure, though I knew nothing about any
               other figures or letters.</text>
            <text x="175" y="60" text-anchor="right">11</text>
            <line x1="0" x2="30" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="30" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : All the other passengers except myself
               were whites. In my ignorance I supposed that the little hotel existed
               for the purpose of accommodating the passengers who travelled on the
               stage-coach. The difference that the colour of one’s skin would make I
               had not thought anything about.</text>
            <text x="40" y="30" text-anchor="right">2</text>
            <line x1="0" x2="135" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="135" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : As they went on describing the school, it seemed to me that it must be
               the greatest place on earth, and not even Heaven presented more
               attractions for me at that time than did the Hampton Normal and
               Agricultural Institute in Virginia, about which these men were talking.
               I resolved at once to go to that school, although I had no idea where
               it was, or how many miles away, or how I was going to reach it; I
               remembered only that I was on fire constantly with one ambition, and
               that was to go to Hampton. This thought was with me day and night.</text>
            <text x="145" y="60" text-anchor="right">9</text>
            <line x1="0" x2="90" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="90" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : The rejoicing on the part of all classes of the
               coloured people, and especially the older ones, over my return, was
               almost pathetic.</text>
            <text x="100" y="30" text-anchor="right">6</text>
            <line x1="0" x2="105" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="105" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : At the end of my first year at Hampton I was confronted with another
               difficulty. Most of the students went home to spend their vacation. I
               had no money with which to go home, but I had to go somewhere. In those
               days very few students were permitted to remain at the school during
               vacation. It made me feel very sad and homesick to see the other
               students preparing to leave and starting for home. I not only had no
               money with which to go home, but I had none with which to go anywhere.</text>
            <text x="115" y="60" text-anchor="right">7</text>
            <line x1="0" x2="15" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="15" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : The ambition to secure an education was most praiseworthy and
               encouraging. The idea, however, was too prevalent that, as soon as one
               secured a little education, in some unexplainable way he would be free
               from most of the hardships of the world, and, at any rate, could live
               without manual labour. There was a further feeling that a knowledge,
               however little, of the Greek and Latin languages would make one a very
               superior human being, something bordering almost on the supernatural. I
               remember that the first coloured man whom I saw who knew something
               about foreign languages impressed me at the time as being a man of all
               others to be envied.</text>
            <text x="25" y="30" text-anchor="right">1</text>
            <line x1="0" x2="75" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="75" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : I cannot help feeling that it would have been wiser if some plan could
               have been put in operation which would have made the possession of a
               certain amount of education or property, or both, a test for the
               exercise of the franchise, and a way provided by which this test should
               be made to apply honestly and squarely to both the white and black
               races.</text>
            <text x="85" y="60" text-anchor="right">5</text>
            <line x1="0" x2="105" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="105" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : The things that they disliked most, I think, were to have their long
               hair cut, to give up wearing their blankets, and to cease smoking; but
               no white American ever thinks that any other race is wholly civilized
               until he wears the white man’s clothes, eats the white man’s food,
               speaks the white man’s language, and professes the white man’s
               religion.</text>
            <text x="115" y="30" text-anchor="right">7</text>
            <line x1="0" x2="75" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="75" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : These gentlemen seemed to take it for granted that no
               coloured man suitable for the position could be secured, and they were
               expecting the General to recommend a white man for the place.</text>
            <text x="85" y="30" text-anchor="right">5</text>
            <line x1="0" x2="105" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="105" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : During the time that I had charge of the Indians and the night-school
               at Hampton, I pursued some studies myself, under the direction of the
               instructors there. One of these instructors was the Rev. Dr. H.B.
               Frissell, the present Principal of the Hampton Institute, General
               Armstrong’s successor.</text>
            <text x="115" y="60" text-anchor="right">7</text>
            <line x1="0" x2="90" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="90" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : after spending
               this month in seeing the actual life of the coloured people, and that
               was that, in order to lift them up, something must be done more than
               merely to imitate New England education as it then existed.</text>
            <text x="100" y="30" text-anchor="right">6</text>
            <line x1="0" x2="240" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="240" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : in order to lift them up, something must be done more than
               merely to imitate New England education as it then existed.</text>
            <text x="250" y="60" text-anchor="right">16</text>
            <line x1="0" x2="45" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="45" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : In their poverty
               and ignorance it was pathetic to see their attempts to get joy out of
               the season that in most parts of the country is so sacred and so dear
               to the heart. In one cabin I notice that all that the five children had
               to remind them of the coming of Christ was a single bunch of
               firecrackers, which they had divided among them.</text>
            <text x="55" y="30" text-anchor="right">3</text>
            <line x1="0" x2="150" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="150" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : In the school we made a special effort to teach our students the
               meaning of Christmas, and to give them lessons in its proper
               observance. In this we have been successful to a degree that makes me
               feel safe in saying that the season now has a new meaning, not only
               through all that immediate region, but, in a measure, wherever our
               graduates have gone.</text>
            <text x="160" y="60" text-anchor="right">10</text>
            <line x1="0" x2="45" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="45" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : The making of these bricks taught me an important lesson in regard to
               the relations of the two races in the South. Many white people who had
               had no contact with the school, and perhaps no sympathy with it, came
               to us to buy bricks because they found out that ours were good bricks.
               They discovered that we were supplying a real want in the community.
               The making of these bricks caused many of the white residents of the
               neighbourhood to begin to feel that the education of the Negro was not
               making him worthless, but that in educating our students we were adding
               something to the wealth and comfort of the community.</text>
            <text x="55" y="30" text-anchor="right">3</text>
            <line x1="0" x2="90" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="90" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : From the very beginning, at Tuskegee, I was determined to have the
               students do not only the agricultural and domestic work, but to have
               them erect their own buildings. My plan was to have them, while
               performing this service, taught the latest and best methods of labour,
               so that the school would not only get the benefit of their efforts, but
               the students themselves would be taught to see not only utility in
               labour, but beauty and dignity; would be taught, in fact, how to lift
               labour up from mere drudgery and toil, and would learn to love work for
               its own sake. My plan was not to teach them to work in the old way, but
               to show them how to make the forces of nature—air, water, steam,
               electricity, horse-power—assist them in their labour.</text>
            <text x="100" y="60" text-anchor="right">6</text>
            <line x1="0" x2="30" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="30" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : Another thing that is becoming more apparent each year in the
               development of education in the South is the influence of General
               Armstrong’s idea of education; and this not upon the blacks alone, but
               upon the whites also. At the present time there is almost no Southern
               state that is not putting forth efforts in the direction of securing
               industrial education for its white boys and girls, and in most cases it
               is easy to trace the history of these efforts back to General
               Armstrong.</text>
            <text x="40" y="30" text-anchor="right">2</text>
            <line x1="0" x2="90" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="90" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : With
               God’s help, I believe that I have completely rid myself of any ill
               feeling toward the Southern white man for any wrong that he may have
               inflicted upon my race. I am made to feel just as happy now when I am
               rendering service to Southern white men as when the service is rendered
               to a member of my own race. I pity from the bottom of my heart any
               individual who is so unfortunate as to get into the habit of holding
               race prejudice.</text>
            <text x="100" y="60" text-anchor="right">6</text>
            <line x1="0" x2="15" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="15" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : After that kindly introduction I began going North alone to secure
               funds. During the last fifteen years I have been compelled to spend a
               large proportion of my time away from the school, in an effort to
               secure money to provide for the growing needs of the institution. In my
               efforts to get funds I have had some experiences that may be of
               interest to my readers. Time and time again I have been asked, by
               people who are trying to secure money for philanthropic purposes, what
               rule or rules I followed to secure the interest and help of people who
               were able to contribute money to worthy objects. As far as the science
               of what is called begging can be reduced to rules, I would say that I
               have had but two rules. First, always to do my whole duty regarding
               making our work known to individuals and organizations; and, second,
               not to worry about the results. This second rule has been the hardest
               for me to live up to. When bills are on the eve of falling due, with
               not a dollar in hand with which to meet them, it is pretty difficult to
               learn not to worry, although I think I am learning more and more each
               year that all worry simply consumes, and to no purpose, just so much
               physical and mental strength that might otherwise be given to effective
               work. After considerable experience in coming into contact with wealthy
               and noted men, I have observed that those who have accomplished the
               greatest results are those who “keep under the body”; are those who
               never grow excited or lose self-control, but are always calm,
               self-possessed, patient, and polite. I think that President William
               McKinley is the best example of a man of this class that I have ever
               seen.</text>
            <text x="25" y="30" text-anchor="right">1</text>
            <line x1="0" x2="45" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="45" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : He knew
               that the people in the North who gave money gave it for the purpose of
               helping the whole cause of Negro civilization, and not merely for the
               advancement of any one school. The General knew, too, that the way to
               strengthen Hampton was to make it a centre of unselfish power in the
               working out of the whole Southern problem.</text>
            <text x="55" y="60" text-anchor="right">3</text>
            <line x1="0" x2="180" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="180" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : 
               Soon after the opening of our boarding department, quite a number of
               students who evidently were worthy, but who were so poor that they did
               not have any money to pay even the small charges at the school, began
               applying for admission. This class was composed of both men and women.
               It was a great trial to refuse admission to these applicants, and in
               1884 we established a night-school to accommodate a few of them.</text>
            <text x="190" y="30" text-anchor="right">12</text>
            <line x1="0" x2="255" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="255" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : These white people afterward frankly told me that
               they went to this meeting expecting to hear the South roundly abused,
               but were pleasantly surprised to find that there was no word of abuse
               in my address.</text>
            <text x="265" y="60" text-anchor="right">17</text>
            <line x1="0" x2="105" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="105" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : Ignorant and inexperienced, it is not
               strange that in the first years of our new life we began at the top
               instead of at the bottom; that a seat in Congress or the state
               legislature was more sought than real estate or industrial skill; that
               the political convention or stump speaking had more attractions than
               starting a dairy farm or truck garden.</text>
            <text x="115" y="30" text-anchor="right">7</text>
            <line x1="0" x2="165" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="165" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : One-third of the population of the South is of the Negro race. No
               enterprise seeking the material, civil, or moral welfare of this
               section can disregard this element of our population and reach the
               highest success.</text>
            <text x="175" y="60" text-anchor="right">11</text>
            <line x1="0" x2="60" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="60" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : “Booker T. Washington received his Harvard A.M.
               last June, the first of his race,” said Governor Wolcott, “to receive
               an honorary degree from the oldest university in the land, and this for
               the wise leadership of his people.”</text>
            <text x="70" y="30" text-anchor="right">4</text>
            <line x1="0" x2="120" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="120" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : It is the first time that a Negro has made a speech in the South on any
               important occasion before an audience composed of white men and women.</text>
            <text x="130" y="60" text-anchor="right">8</text>
            <line x1="0" x2="30" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="30" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : Another thing at Tuskegee out of which I get a great deal of pleasure
               and satisfaction is in the meeting with our students, and teachers, and
               their families, in the chapel for devotional exercises every evening at
               half-past eight, the last thing before retiring for the night. It is an
               inspiring sight when one stands on the platform there and sees before
               him eleven or twelve hundred earnest young men and women; and one
               cannot but feel that it is a privilege to help to guide them to a
               higher and more useful life.</text>
            <text x="40" y="30" text-anchor="right">2</text>
            <line x1="0" x2="60" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="60" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : Luxuries had
               always seemed to me to be something meant for white people, not for my
               race.</text>
            <text x="70" y="60" text-anchor="right">4</text>
            <line x1="0" x2="90" y1="30" y2="30" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="90" y1="45" y2="45" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="30" text-anchor="end">1 : As this was the first time that a New England university had conferred
               an honorary degree upon a Negro, it was the occasion of much newspaper
               comment throughout the country.</text>
            <text x="100" y="30" text-anchor="right">6</text>
            <line x1="0" x2="90" y1="60" y2="60" stroke-width="10" stroke="purple"></line>
            <line x1="0" x2="90" y1="75" y2="75" stroke-width="10" stroke="yellow"></line>
            <text x="-10" y="60" text-anchor="end">2 : There are in constant operation at the school, in connection with
               thorough academic and religious training, thirty industrial
               departments. All of these teach industries at which our men and women
               can find immediate employment as soon as they leave the institution.</text>
            <text x="100" y="60" text-anchor="right">6</text>
            <line x1="0" y1="0" x2="0" y2="600" stroke="black" stroke-width="3"></line>
